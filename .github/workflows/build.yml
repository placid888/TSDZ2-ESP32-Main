name: TSDZ2 ESP32 Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Force ESP32-S3 Bluetooth Config
        run: |
          rm -f sdkconfig
          echo "CONFIG_BT_ENABLED=y" >> sdkconfig.defaults
          echo "CONFIG_BT_BLUEDROID_ENABLED=y" >> sdkconfig.defaults
          echo "CONFIG_BT_NIMBLE_ENABLED=n" >> sdkconfig.defaults
          echo "CONFIG_BT_BLE_ENABLED=y" >> sdkconfig.defaults
          echo "CONFIG_BT_GATTS_ENABLE=y" >> sdkconfig.defaults
          echo "CONFIG_BT_GATTC_ENABLE=y" >> sdkconfig.defaults

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v4.4
          target: esp32s3 
          path: '.'

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TSDZ2-ESP32-Firmware
          path: |
            build/*.bin
            build/bootloader/*.bin
            build/partition_table/*.bin
            build/flasher_args.json
          retention-days: 7