name: Build ESP32 Firmware

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v4.4
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Enable Bluetooth and Build
        run: |
          . /opt/esp/idf/export.sh
          
          # 1. 寫入預設檔，確保初始化時包含藍牙設定
          echo "CONFIG_BT_ENABLED=y" >> sdkconfig.defaults
          echo "CONFIG_BT_BLUEDROID_ENABLED=y" >> sdkconfig.defaults
          echo "CONFIG_BT_CLASSIC_ENABLED=y" >> sdkconfig.defaults
          echo "CONFIG_BT_SPP_ENABLED=y" >> sdkconfig.defaults
          
          # 2. 建立目標設定檔
          idf.py set-target esp32
          
          # 3. 強制在生成的設定檔最末端覆蓋藍牙設定 (最後讀取的會生效)
          echo "CONFIG_BT_ENABLED=y" >> sdkconfig
          echo "CONFIG_BT_BLUEDROID_ENABLED=y" >> sdkconfig
          echo "CONFIG_BT_CLASSIC_ENABLED=y" >> sdkconfig
          echo "CONFIG_BT_SPP_ENABLED=y" >> sdkconfig
          
          # 4. 重新載入設定並開始編譯
          idf.py reconfigure
          idf.py build

      - name: Collect Binaries
        run: |
          mkdir -p esp32_output
          # 收集編譯好的 firmware, bootloader 與 partition-table
          find build -maxdepth 1 -name "*.bin" -exec cp {} esp32_output/ \;
          find build/bootloader -name "*.bin" -exec cp {} esp32_output/ \;
          find build/partition_table -name "*.bin" -exec cp {} esp32_output/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-binaries
          path: esp32_output/*.bin